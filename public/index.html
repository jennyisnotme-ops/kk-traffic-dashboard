<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KK 流量儀表板</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/libs/chart.umd.js"></script>
</head>
<body>

<!-- 登入層 -->
<div id="login-overlay">
  <form id="login-form">
    <h1>KK 流量儀表板</h1>
    <input type="password" id="login-secret" placeholder="輸入密碼" autocomplete="current-password">
    <button type="submit">登入</button>
    <p id="login-error"></p>
  </form>
</div>

<!-- 主畫面 -->
<div id="main" hidden>
  <header>
    <h1>KK 流量儀表板</h1>
    <nav id="tabs">
      <button data-tab="overview" class="active">總覽</button>
      <button data-tab="ga">GA 流量</button>
      <button data-tab="fb">粉專成效</button>
      <button data-tab="ads">廣告成效</button>
    </nav>
    <div id="date-controls">
      <button data-range="7">近 7 天</button>
      <button data-range="30" class="active">近 30 天</button>
      <button data-range="90">近 90 天</button>
      <button data-range="thisMonth">本月</button>
      <button data-range="lastMonth">上月</button>
      <input type="date" id="date-from"> ~ <input type="date" id="date-to">
      <button id="date-apply">套用</button>
    </div>
    <div id="status-bar">
      <span id="last-update"></span>
      <button id="refetch-btn">手動重抓</button>
      <button id="logout-btn">登出</button>
    </div>
  </header>

  <main>
    <section id="tab-overview" class="tab active"></section>
    <section id="tab-ga" class="tab"></section>
    <section id="tab-fb" class="tab"></section>
    <section id="tab-ads" class="tab"></section>
  </main>
</div>

<script src="/js/cards.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
