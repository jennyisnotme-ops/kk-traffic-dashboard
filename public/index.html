<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KK 流量儀表板</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<script src="/libs/chart.umd.js"></script>
<script src="/libs/sortable.min.js"></script>
</head>
<body>

<!-- 登入層 -->
<div id="login-overlay">
  <form id="login-form">
    <h1>KK 流量儀表板</h1>
    <input type="text" id="login-username" placeholder="帳號" autocomplete="username">
    <input type="password" id="login-password" placeholder="密碼" autocomplete="current-password">
    <button type="submit">登入</button>
    <p id="login-error"></p>
  </form>
</div>

<!-- 主畫面 -->
<div id="main" hidden>
  <aside id="sidebar">
    <div id="sidebar-logo"><img src="/logo_sidebar.png" alt=""> <span>KK 流量儀表板</span></div>
    <nav id="menu">
      <button class="menu-item active" data-page="overview">總覽</button>
      <button class="menu-item" data-page="ga">GA 流量</button>
      <div class="menu-group" id="menu-fb">
        <button class="menu-item menu-parent" data-group="fb">粉專</button>
        <div class="menu-sub">
          <button class="menu-item sub" data-page="fb_insights">粉專成效</button>
          <button class="menu-item sub" data-page="fb_posts">貼文成效</button>
          <button class="menu-item sub" data-page="fb_ads">廣告</button>
        </div>
      </div>
      <button class="menu-item" data-page="custom">自訂報表</button>
      <button class="menu-item" id="menu-users" data-page="users" hidden>帳號管理</button>
      <button class="menu-item" id="menu-digest" data-page="digest" hidden>每日摘要</button>
      <div class="menu-group" id="menu-settings">
        <button class="menu-item menu-parent" data-group="settings">設定</button>
        <div class="menu-sub">
          <button class="menu-item sub" data-page="settings_password">改密碼</button>
          <button class="menu-item sub" data-page="settings_theme">外觀主題</button>
        </div>
      </div>
    </nav>
    <div id="sidebar-bottom">
      <span id="last-update"></span>
      <button id="refetch-btn">手動重抓</button>
      <button id="logout-btn">登出</button>
    </div>
  </aside>
  <div id="content">
    <button id="menu-toggle" aria-label="開啟選單">☰</button>
    <header id="topbar">
      <div id="date-controls">
        <select id="date-preset">
          <option value="7">近 7 天</option>
          <option value="30" selected>近 30 天</option>
          <option value="90">近 90 天</option>
          <option value="thisMonth">本月</option>
          <option value="lastMonth">上月</option>
          <option value="custom">自訂區間</option>
        </select>
        <span id="custom-range" hidden>
          <input type="date" id="date-from"> ~ <input type="date" id="date-to">
          <button id="date-apply">套用</button>
        </span>
        <label id="compare-label"><input type="checkbox" id="compare-on"> 比較</label>
        <span id="compare-controls" hidden>
          <select id="compare-mode">
            <option value="prev" selected>前一期</option>
            <option value="custom">自訂區間</option>
          </select>
          <span id="compare-custom" hidden>
            <input type="date" id="cmp-from"> ~ <input type="date" id="cmp-to">
            <button id="compare-apply">套用比較</button>
          </span>
        </span>
      </div>
    </header>
    <main>
      <section id="page-overview" class="page active">
        <div id="overview-toolbar">
          <button type="button" id="edit-layout-btn">編輯版面</button>
          <button type="button" id="edit-layout-default-btn" hidden>編輯全部門預設版</button>
        </div>
        <div id="overview-cards"></div>
      </section>
      <section id="page-ga" class="page"></section>
      <section id="page-fb_insights" class="page"></section>
      <section id="page-fb_posts" class="page"></section>
      <section id="page-fb_ads" class="page"></section>
      <section id="page-custom" class="page"></section>
      <section id="page-users" class="page"></section>
      <section id="page-digest" class="page"></section>
      <section id="page-settings_password" class="page"></section>
      <section id="page-settings_theme" class="page"></section>
    </main>
  </div>
</div>
<div id="sidebar-overlay" hidden></div>

<div id="export-modal" hidden>
  <div id="export-panel">
    <h3>匯出</h3>
    <div id="export-formats"></div>
    <div id="export-fields"></div>
    <div id="export-actions"><button id="export-cancel">取消</button><button id="export-go">匯出</button></div>
  </div>
</div>

<div id="report-modal" hidden>
  <div id="report-panel">
    <h3 id="report-title">新增報表</h3>
    <input type="text" id="report-name" placeholder="報表名稱（50 字內）" maxlength="50">
    <div id="report-metrics"></div>
    <div>圖表類型：
      <select id="report-type">
        <option value="smooth">曲線</option><option value="line">折線</option>
        <option value="bar">長條</option><option value="pie">圓餅</option>
      </select>
    </div>
    <div id="report-actions"><button id="report-cancel">取消</button><button id="report-save">儲存</button></div>
  </div>
</div>

<div id="user-modal" hidden>
  <div id="user-panel">
    <h3 id="user-title">新增帳號</h3>
    <p id="user-error" class="form-error"></p>
    <label>帳號<input type="text" id="user-username" placeholder="英數._- 3-30 字元" autocomplete="off"></label>
    <label id="user-password-field">密碼<input type="password" id="user-password" placeholder="至少 6 字元" autocomplete="new-password"></label>
    <label>顯示名稱<input type="text" id="user-display-name" maxlength="50"></label>
    <div id="user-role">角色：
      <label><input type="radio" name="user-role-radio" value="admin"> 管理員</label>
      <label><input type="radio" name="user-role-radio" value="user" checked> 一般使用者</label>
    </div>
    <div id="user-pages">可視頁面：</div>
    <label id="user-enabled-field" hidden><input type="checkbox" id="user-enabled" checked> 啟用中</label>
    <div id="user-actions"><button type="button" id="user-cancel">取消</button><button type="button" id="user-save">儲存</button></div>
  </div>
</div>

<div id="reset-pw-modal" hidden>
  <div id="reset-pw-panel">
    <h3>重設密碼</h3>
    <p id="reset-pw-error" class="form-error"></p>
    <label>新密碼<input type="password" id="reset-pw-new" placeholder="至少 6 字元" autocomplete="new-password"></label>
    <div id="reset-pw-actions"><button type="button" id="reset-pw-cancel">取消</button><button type="button" id="reset-pw-save">重設</button></div>
  </div>
</div>

<div id="layout-edit-modal" hidden>
  <div id="layout-edit-panel">
    <h3 id="layout-edit-title">編輯版面</h3>
    <p id="layout-edit-warning" class="form-error" hidden>此變更將影響所有未自訂版面的使用者</p>
    <p class="layout-edit-hint">勾選要顯示的卡片，拖曳 <span class="drag-handle">⠿</span> 調整順序。</p>
    <div id="layout-edit-list"></div>
    <div id="layout-edit-actions">
      <button type="button" id="layout-edit-restore">恢復預設</button>
      <span class="spacer"></span>
      <button type="button" id="layout-edit-cancel">取消</button>
      <button type="button" id="layout-edit-save">儲存</button>
    </div>
  </div>
</div>

<script src="/js/cards.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
